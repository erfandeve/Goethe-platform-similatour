# /etc/nginx/sites-available/lexora — replace every "example.com" with the real domain,
# then: ln -s ../sites-available/lexora /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# and:  certbot --nginx -d example.com -d www.example.com   (adds the 443 blocks and the http→https redirect)

# One address per page: www goes to the bare domain, permanently.
server {
    listen 80;
    server_name www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 80;
    server_name example.com;

    # Lesson videos go through the admin upload (512 MB cap in the API).
    client_max_body_size 600m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Media: uploads on disk first, then the copies shipped inside the app
    # (exam audio, pictures, covers). Both are immutable under their names.
    location /media/ {
        root /var/www/lexora/backend;
        try_files $uri @next;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI speaking answers wait on transcription + analysis; uploads are big.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @next {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
