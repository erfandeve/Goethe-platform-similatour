# /etc/nginx/sites-available/lexart — lexart.ir
# certbot --nginx adds the 443 listeners and certificates to the two
# "listen 80" server blocks below; everything else here stays as written.

# Per-address request budgets: sign-in/sign-up are what gets brute-forced,
# the API proxy is what a scraper hammers.
limit_req_zone $binary_remote_addr zone=lexart_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lexart_api:10m rate=20r/s;
limit_req_status 429;

# One address per page: www goes to the bare domain, permanently.
server {
    listen 80;
    server_name www.lexart.ir;
    return 301 https://lexart.ir$request_uri;
}

server {
    listen 80;
    server_name lexart.ir;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

    # Nothing under a dot-path (.env, .git) is ever served.
    location ~ /\. { deny all; return 404; }

    # Media: uploads on disk first, then the copies shipped inside the app
    # (exam audio, pictures, covers). Immutable under their names.
    location /media/ {
        root /var/www/lexart/backend;
        try_files $uri @next;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ ^/api/session/(login|register)$ {
        limit_req zone=lexart_auth burst=10 nodelay;
        include /etc/nginx/lexart-proxy.conf;
    }

    # Lesson videos from the back office: large, slow, streamed through.
    location = /api/admin/upload {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        include /etc/nginx/lexart-proxy.conf;
    }

    location /api/ {
        limit_req zone=lexart_api burst=60 nodelay;
        include /etc/nginx/lexart-proxy.conf;
    }

    location / {
        include /etc/nginx/lexart-proxy.conf;
    }

    location @next {
        include /etc/nginx/lexart-proxy.conf;
    }
}
