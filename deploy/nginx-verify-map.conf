# 1 for ownership-verification files, which must answer 200 everywhere:
# on http and https, with and without www, without a redirect in between.
map $uri $verify_file {
    default                             0;
    /63581236.txt                       1;
    /googleaadce0dda8a222de.html        1;
}

# The bare domain answers with the home page itself instead of redirecting to
# /fa: verification robots (Enamad) read only the first response. The page
# still names /fa as its canonical URL, so search engines index one address.
# The visitor's own language is still honoured here.
map $http_accept_language $home_locale {
    default      /fa;
    "~*^de"      /de;
    "~*^en"      /en;
}
