# Ownership checks (Enamad, Google and friends) fetch a plain file and do not
# follow redirects, so these answer 200 in every server block. Any digits-only
# .txt name works — Enamad issues a new code on each attempt — and Persian
# digits are covered too, in case their checker ever sends them.
# Case-insensitive, and a trailing slash is tolerated: verifier robots are
# not consistent about either.
location ~* "^/([0-9۰-۹]+)\.txt/?$" {
    root /var/www/verify;
    try_files /$1.txt =404;
    default_type text/plain;
}
location = /googleaadce0dda8a222de.html { root /var/www/verify; default_type text/html; }
